[package]
name = "kuron-desktop"
version = "0.1.0"
description = "Kuron Desktop — baca manga multi-sumber di desktop (Tauri v2 + Rust + Svelte)"
authors = ["nhasix"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kuron_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Suite live opt-in (internet + keychain OS + situs nyata).
# `cargo test` default = 100% deterministik offline, 0 failed 0 ignored.
# Verifikasi live manual: `cargo test --features live-tests`.
live-tests = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
ts-rs = "12.0.1"
async-trait = "0.1.92"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.2.0"
scraper = "0.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "charset", "system-proxy"] }
serde_json_path = "0.7.2"
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }
sha2 = "0.11.0"
zip = "8.6.0"
dirs = "7.0.0"
regex = "1.13.1"
tauri-plugin-dialog = "2.7.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
